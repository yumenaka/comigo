[tools]
go = { version = "latest", install_env = { GOROOT = "" } }
bun = "latest"
"conda:make" = { version = "latest", os = ["macos", "linux", "windows/x64"] }
# 与 go.mod 同步，避免生成器和模板运行库版本不一致。
"go:github.com/a-h/templ/cmd/templ" = "0.3.1100"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "3.0.0"
"go:github.com/air-verse/air" = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
"go:github.com/josephspurrier/goversioninfo/cmd/goversioninfo" = "latest"

[env]
# 空值让 Go 使用当前工具链自身的根目录，避免继承已失效的本机安装路径。
GOROOT = ""

[tasks.setup]
description = "安装 Go 与前端依赖"
alias = "i"
run = ["go mod download", "bun install"]

[tasks.generate]
description = "格式化并生成 templ 代码"
alias = ["g", "gen"]
run = "templ fmt ./templ && templ generate"

[tasks.frontend]
description = "生成未压缩的前端资源"
alias = "fe"
run = "bun run dev"

[tasks.dev]
description = "使用 Wails v3 启动桌面开发环境"
alias = "d"
run = "bun run wails:dev"

[tasks.run]
description = "生成模板并直接启动 Web 服务"
alias = "r"
run = "templ fmt ./templ && templ generate && go run main.go"

[tasks.test]
description = "运行 Go 测试"
alias = "t"
run = "go test ./..."

[tasks.sqlc]
description = "重新生成 sqlc 代码"
alias = "db"
run = "sqlc generate"

[tasks.wails-dev]
description = "启动 Wails v3 开发环境"
alias = "wd"
run = "bun run wails:dev"

[tasks.wails-build]
description = "构建当前平台的 Wails v3 应用"
alias = "wb"
run = "bun run wails:build"

[tasks.release]
description = "通过现有 Makefile 构建全部发布产物"
alias = "rel"
run = "make all"

[tasks.clean]
description = "清理现有 Makefile 构建产物"
alias = "c"
run = "make clean"
